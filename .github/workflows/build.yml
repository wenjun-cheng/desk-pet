# Tests on Windows, macOS and Linux for every push; when a release is published, builds the three zips and
# attaches them to it.
name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install -r requirements-dev.txt
      - name: Test
        run: $PY -m pytest -q tests
      - name: Build
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then pwsh -File build.ps1; else ./build.sh; fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          name: DeskPet-${{ runner.os }}
          path: dist/*.zip

  release:
    # (Also when one system's build failed: the others' zips still get attached.)
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.zip --clobber --repo "${{ github.repository }}"
